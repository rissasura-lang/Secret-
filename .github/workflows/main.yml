name: RDP_Flexible_Duration

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Durasi RDP dalam jam (1-24 jam)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'
          - '8'
          - '12'
          - '24'

jobs:
  rdp-job:
    runs-on: windows-latest
    timeout-minutes: ${{ (inputs.duration_hours * 60) + 10 }}

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 16 | % {[char]$_})
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Show Connection Info
        run: |
          Write-Host "`n============================ RDP READY ============================"
          Write-Host "Durasi Aktif   : ${{ inputs.duration_hours }} jam"
          Write-Host "Username       : $env:RDP_USER"
          Write-Host "Password       : $env:RDP_PASS"
          Write-Host "IP Publik      : $(Invoke-RestMethod -Uri 'https://api.ipify.org')"
          Write-Host "Port           : 3389"
          Write-Host "================================================================`n"
          Start-Sleep -Seconds 15

      - name: Countdown Timer
        run: |
          $endTime = (Get-Date).AddHours(${{
          if (inputs.duration_hours == '24') { 23 }
          else { inputs.duration_hours }
          }})
          while ((Get-Date) -lt $endTime) {
            $remaining = ($endTime - (Get-Date)).ToString("hh\jam\m\e\n\i\t\e\s\s\ \d\a\l\a\m")
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP aktif sisa waktu: $remaining"
            Start-Sleep -Seconds 60
          }
          Write-Host "Waktu RDP habis! Instance akan dimatikan otomatis..."
          
